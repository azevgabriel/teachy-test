services:
  postgres:
    image: postgres:16-alpine
    container_name: teachy_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-teachy_db}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-teachy_db}']
      interval: 5s
      timeout: 5s
      retries: 5

  engine:
    build:
      context: ../engine
      dockerfile: Dockerfile
    container_name: teachy_engine
    restart: unless-stopped
    volumes:
      - ../engine/handler.py:/var/task/handler.py
      - ../engine/docx_renderer.py:/var/task/docx_renderer.py
      - ../engine/pdf_renderer.py:/var/task/pdf_renderer.py
    ports:
      - '${ENGINE_PORT:-8080}:8080'

  service:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
      args:
        DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-teachy_db}?schema=public
    container_name: teachy_service
    restart: unless-stopped
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-teachy_db}?schema=public
      PORT: ${PORT:-3000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ENGINE_URL: http://engine:8080/2015-03-31/functions/function/invocations
    ports:
      - '${PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      engine:
        condition: service_started

volumes:
  postgres_data:
